services:
  postgres:
    image: postgres:16-alpine
    container_name: mycampusview-postgres
    environment:
      POSTGRES_USER: mycampusview
      POSTGRES_PASSWORD: mycampusview
      POSTGRES_DB: mycampusview
    ports: ['5433:5432']
    volumes: ['mycampusview-pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mycampusview -d mycampusview']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: mycampusview-redis
    ports: ['6380:6379']
    volumes: ['mycampusview-redisdata:/data']

volumes:
  mycampusview-pgdata:
  mycampusview-redisdata:
