name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: schoolos
          POSTGRES_PASSWORD: schoolos
          POSTGRES_DB: schoolos_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U schoolos"
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      DATABASE_URL: postgresql://schoolos:schoolos@localhost:5432/schoolos_test?schema=public
      AUTH_SECRET: ci-secret-value-that-is-long-enough-for-validation
      APP_ROOT_DOMAIN: lvh.me:3000
      APP_URL: http://lvh.me:3000

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # The isolation tests assert against two real tenants, so the database
      # must be seeded before they run.
      - name: Seed
        run: npm run db:seed

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
